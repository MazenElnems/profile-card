<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <!-- font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <!-- font awesome -->
    <link rel="stylesheet" href="assets/fontawesome-free-7.1.0-web/css/all.min.css">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img src="assets/images/mazen.JPG" alt="my image">
        </div>

        <div class="description">
            <span class="name">Mazen Elnems</span>
            <span class="job-title">Fullstack .NET & Angular Developer</span>
        </div>
        
        <div class="social-links">
            <a href="#" style="background-color:#4267b2 ;">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="#" style="background-color:#1da1f2;">
                <i class="fa-brands fa-twitter"></i>
            </a>
            <a href="#" style="background-color: #e1306c;">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="#" style="background-color: #ff0000;">
                <i class="fa-brands fa-youtube"></i>
            </a>
        </div>

        <div class="contact-links">
            <a href="#" class="link">Message</a>
            <a href="mailto:mazenelnems22@gmail.com" class="link">Email Me</a>
        </div>
    </div>

</body>
</html>
